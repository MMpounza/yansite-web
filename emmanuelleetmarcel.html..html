 d\'un amour que l\'on devine sans encore le nommer.\\nPuis, un jour, le destin a cessé de se jouer de nous. Nos regards se sont croisés, et l’errance a pris fin.\\nCe qui n\'était qu\'un échange discret est devenu le souffle de notre existence. Depuis ce jour, notre amour s\'est tissé avec la force de l\'évidence : dans l\'éclat de nos rires, la douceur de nos gestes et cette complicité rare où les mots deviennent superflus. Nous ne vivons pas un conte de fées, mais une histoire vraie, vibrante de respect, de lumière et d\'une connexion d\'une profondeur infinie.\\nAujourd\'hui, nous choisissons de célébrer ce lien sacré devant vous. Vous qui avez été témoins de nos chemins solitaires, soyez aujourd\'hui les témoins de notre union. Car l\'amour, lorsqu\'il est enfin retrouvé et si sincère, est un trésor qui mérite d\'être partagé.\\n\\n"}],"B":[{"A?":"A","A":{"color":{"B":"#22438a"},"fill-id":{"B":"none"},"font-family":{"B":"YAD0xKJP184,0"},"font-size":{"B":"32.2279"},"leading":{"B":"1080.0"}}},{"A?":"B","A":291},{"A?":"A","A":{"font-size":{"B":"17.774"},"leading":{}}},{"A?":"B","A":107},{"A?":"A","A":{"font-size":{"B":"24.9083"},"leading":{"B":"1080.0"}}},{"A?":"B","A":1},{"A?":"A","A":{"font-size":{"B":"28.9082"},"leading":{}}},{"A?":"B","A":398},{"A?":"A","A":{"leading":{"B":"1080.0"}}},{"A?":"B","A":1},{"A?":"A","A":{"font-size":{"B":"17.774"},"leading":{}}},{"A?":"B","A":265},{"A?":"A","A":{"font-size":{"B":"24.9083"},"leading":{"B":"1080.0"}}},{"A?":"B","A":1},{"A?":"A","A":{"font-family":{"B":"YACgEVY5j_w,0"},"font-size":{"B":"16.6472"},"font-weight":{"B":"bold"}}},{"A?":"B","A":1},{"A?":"A","A":{"color":{},"fill-id":{},"font-family":{},"font-size":{},"font-weight":{},"leading":{}}}],"E":{}},"b":{"A":[77,82,87,45,108,95,99,97,88,20,110,115,41,1]},"d":"A","e":692.1334562456093,"f":414.932506,"l":false,"h":"A"},{"A?":"K","A":899.10086733126,"B":5.684341886080802E-14,"D":634.0,"C":142.8,"E":0.0,"F":0.0,"BD":[],"BE":[],"BA":[],"BB":[],"Q":false,"S":false,"N":"su
